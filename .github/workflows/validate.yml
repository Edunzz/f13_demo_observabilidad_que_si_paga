name: validate

# CI 100% local al runner de GitHub Actions. No requiere credenciales de Azure:
# el aprovisionamiento real (infra/azure/deploy.sh) se ejecuta manualmente por
# el operador, nunca desde este workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          ignore_paths: ".git"

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yamllint
        run: pip install yamllint==1.35.1
      - name: Validar YAML del repo
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" \
            compose.yaml \
            observability/otel-collector/config.yaml \
            observability/prometheus/prometheus.yml \
            observability/prometheus/rules.yml \
            observability/grafana/provisioning/datasources/datasources.yaml \
            observability/grafana/provisioning/dashboards/dashboards.yaml \
            infra/azure/cloud-init.yaml \
            .github/workflows/validate.yml

  python-tests:
    name: Pruebas Python (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [shop-api, payment-service, value-exporter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de ${{ matrix.service }}
        working-directory: app/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.3.3
      - name: Ejecutar pytest
        working-directory: app/${{ matrix.service }}
        run: pytest -v

  dashboards-json:
    name: Validar JSON de dashboards Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON
        run: |
          python3 -c "
          import json, sys
          files = [
              'observability/grafana/dashboards/01-tecnico.json',
              'observability/grafana/dashboards/02-impacto-negocio.json',
          ]
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  json.load(fh)
              print(f, 'OK')
          "

  drawio-check:
    name: Validar diagrama Draw.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar que architecture.drawio es XML bien formado
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('docs/architecture.drawio'); print('architecture.drawio OK')"
      - name: Verificar que existe el PNG exportado
        run: test -s docs/images/architecture.png

  secret-scan:
    name: Busqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-and-smoke:
    name: Build + docker compose + smoke tests
    runs-on: ubuntu-latest
    needs: [shellcheck, yaml-lint, python-tests, dashboards-json]
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env de CI
        run: |
          cp .env.example .env
          # Genera credenciales efimeras solo para este run de CI, nunca se commitean.
          sed -i "s/^GF_SECURITY_ADMIN_PASSWORD=.*/GF_SECURITY_ADMIN_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^FAULT_ADMIN_TOKEN=.*/FAULT_ADMIN_TOKEN=$(openssl rand -hex 16)/" .env

      - name: docker compose config --quiet
        run: docker compose config --quiet

      - name: Build de imagenes locales
        run: docker compose build --pull

      - name: Levantar el stack
        run: docker compose up -d

      - name: Esperar healthchecks (timeout 5 min)
        run: |
          deadline=$((SECONDS + 300))
          while [ $SECONDS -lt $deadline ]; do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -v 'healthy' | grep -v '^$' || true)
            if [ -z "$unhealthy" ]; then
              echo "Todos los servicios estan healthy."
              break
            fi
            echo "Esperando healthchecks..."
            sleep 5
          done
          docker compose ps

      - name: Ejecutar smoke tests (modo local, sin Azure)
        env:
          TARGET_HOST: localhost
        run: bash scripts/smoke-test.sh

      - name: Volcar logs si algo fallo
        if: failure()
        run: docker compose logs --tail=300

      - name: Apagar el stack
        if: always()
        run: docker compose down -v
