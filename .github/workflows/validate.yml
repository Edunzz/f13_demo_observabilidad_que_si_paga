name: validate

# CI 100% dentro de GitHub Actions, sin credenciales externas. Valida el mismo
# camino que sigue una persona que abre el repo en GitHub Codespaces:
#   - stack-e2e: corre scripts/lab-up.sh en el runner y luego el ciclo
#     completo de la demo (falla -> impacto en USD -> recuperación -> reset).
#   - devcontainer: construye .devcontainer/ (Docker-in-Docker, igual que un
#     Codespace) y levanta el laboratorio dentro de él.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          # -x: sigue los `source`/`.` hacia otros scripts del propio repo
          # (p.ej. scripts/lib/common.sh), evitando el falso positivo SC1091.
          # -P SCRIPTDIR: busca los archivos `source=` relativos al directorio
          # del propio script (no al cwd desde el que corre shellcheck).
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          scandir: "."
          ignore_paths: ".git"

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar yamllint
        run: pip install yamllint==1.35.1
      - name: Validar YAML del repo
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" \
            compose.yaml \
            observability/otel-collector/config.yaml \
            observability/prometheus/prometheus.yml \
            observability/prometheus/rules.yml \
            observability/grafana/provisioning/datasources/datasources.yaml \
            observability/grafana/provisioning/dashboards/dashboards.yaml \
            .github/workflows/validate.yml

  python-tests:
    name: Pruebas Python (apps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [shop-api, payment-service, value-exporter, load-generator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de ${{ matrix.service }}
        working-directory: app/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar pytest
        working-directory: app/${{ matrix.service }}
        run: python -m pytest -v

  json-files:
    name: Validar JSON (dashboards + devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON
        run: |
          python3 -c "
          import json
          files = [
              'observability/grafana/dashboards/01-tecnico.json',
              'observability/grafana/dashboards/02-impacto-negocio.json',
              '.devcontainer/devcontainer.json',
          ]
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  json.load(fh)
              print(f, 'OK')
          "

  drawio-check:
    name: Validar diagrama Draw.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar que architecture.drawio es XML bien formado
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('docs/architecture.drawio'); print('architecture.drawio OK')"
      - name: Verificar que existe el PNG exportado
        run: test -s docs/images/architecture.png

  secret-scan:
    name: Busqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack-e2e:
    name: Stack E2E (lab-up + falla + recuperacion)
    runs-on: ubuntu-latest
    needs: [shellcheck, yaml-lint, python-tests, json-files]
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el laboratorio (mismo script que el postStartCommand del Codespace)
        run: bash scripts/lab-up.sh

      - name: Snapshot en estado sano
        run: bash scripts/business-snapshot.sh

      - name: Inyectar falla en payment-service
        run: bash scripts/inject-fault.sh --yes

      - name: Verificar que el ingreso en riesgo sube (max 2 min)
        run: |
          for i in $(seq 1 24); do
            value="$(curl -s -G --data-urlencode 'query=max(f13_business_revenue_at_risk_usd_per_minute)' \
              http://localhost:9090/api/v1/query \
              | python3 -c 'import json, sys; r = json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else 0)')"
            echo "Intento ${i}: ingreso en riesgo = ${value} USD/min"
            if python3 -c "import sys; sys.exit(0 if float('${value}') > 0 else 1)"; then
              bash scripts/business-snapshot.sh
              exit 0
            fi
            sleep 5
          done
          echo "El ingreso en riesgo no subio tras inyectar la falla." >&2
          exit 1

      - name: Recuperar y dejar listo para repetir
        run: |
          bash scripts/recover.sh
          bash scripts/demo-reset.sh
          bash scripts/business-snapshot.sh

      - name: Volcar logs si algo fallo
        if: failure()
        run: docker compose logs --tail=300

      - name: Apagar el stack
        if: always()
        run: docker compose down -v

  devcontainer:
    name: Devcontainer de Codespaces (build + lab-up)
    runs-on: ubuntu-latest
    needs: [shellcheck, yaml-lint, python-tests, json-files]
    steps:
      - uses: actions/checkout@v4

      - name: Construir el devcontainer y levantar el laboratorio dentro
        uses: devcontainers/ci@v0.3
        with:
          imageName: f13demo-devcontainer
          push: never
          runCmd: |
            set -e
            bash scripts/lab-up.sh
            bash scripts/status.sh
            bash scripts/inject-fault.sh --yes
            bash scripts/recover.sh
            bash scripts/business-snapshot.sh
